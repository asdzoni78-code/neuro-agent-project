<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>СтройАудит — замеры и перерасход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ШАПКА: заголовок объекта + вкладки (десктоп) -->
  <header class="app-header">
    <h1 class="app-title">СтройАудит</h1>
    <nav class="tabs" id="tabs-desktop" aria-label="Навигация по экранам">
      <button class="tab is-active" data-screen="screen-rooms" type="button">Помещения</button>
      <button class="tab" data-screen="screen-measure" type="button">Замер</button>
      <button class="tab" data-screen="screen-compare" type="button">Сравнение</button>
    </nav>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ: три экрана, виден только активный -->
  <main class="app-main">

    <section id="screen-rooms" class="screen is-active" aria-label="Помещения">
      <div class="screen-inner">
        <h2 class="screen-title">Помещения</h2>
        <!-- Ф3: содержимое рендерится из app.js → renderRooms() -->
        <div id="rooms-root"></div>
      </div>
    </section>

    <section id="screen-measure" class="screen" aria-label="Замер">
      <div class="screen-inner">
        <h2 class="screen-title">Замер</h2>
        <!-- Ф3: содержимое рендерится из app.js → renderMeasure() -->
        <div id="measure-root"></div>
      </div>
    </section>

    <section id="screen-compare" class="screen" aria-label="Сравнение">
      <div class="screen-inner">
        <h2 class="screen-title">Сравнение</h2>
        <!-- Ф4: содержимое рендерится из app.js → renderComparison() -->
        <div id="compare-root"></div>
      </div>
    </section>

  </main>

  <!-- НИЖНЯЯ ПАНЕЛЬ: 3 кнопки-иконки (мобайл) -->
  <nav class="bottom-nav" id="tabs-mobile" aria-label="Навигация по экранам">
    <button class="nav-btn is-active" data-screen="screen-rooms" type="button">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span class="nav-label">Помещения</span>
    </button>
    <button class="nav-btn" data-screen="screen-measure" type="button">
      <span class="nav-icon" aria-hidden="true">📐</span>
      <span class="nav-label">Замер</span>
    </button>
    <button class="nav-btn" data-screen="screen-compare" type="button">
      <span class="nav-icon" aria-hidden="true">📊</span>
      <span class="nav-label">Сравнение</span>
    </button>
  </nav>

  <!-- Переключение экранов (минимальный каркас-скрипт Ф0).
       В следующих фазах навигация переедет в app.js. -->
  <script>
    (function () {
      function switchScreen(screenId) {
        // Показать нужный экран, скрыть остальные
        document.querySelectorAll('.screen').forEach(function (s) {
          s.classList.toggle('is-active', s.id === screenId);
        });
        // Подсветить активные пункты навигации (и вкладки, и нижняя панель)
        document.querySelectorAll('[data-screen]').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.dataset.screen === screenId);
        });
      }

      document.querySelectorAll('[data-screen]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchScreen(btn.dataset.screen);
        });
      });
    })();
  </script>

  <!-- Логика приложения. Порядок важен: config → app → ai-agent -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ai-agent.js"></script>

</body>
</html>
