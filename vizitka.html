<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Евгений — Система вместо хаоса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080d14;
    --accent1: #1d6fff;
    --accent2: #00c8ff;
    --glow:    rgba(0, 180, 255, 0.35);
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Golos Text', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 48px;
    max-width: 460px;
    width: 90%;
    border-radius: 20px;
    background: rgba(8, 18, 32, 0.75);
    border: 1px solid rgba(29, 111, 255, 0.18);
    backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px rgba(0, 200, 255, 0.06),
      0 0 60px rgba(29, 111, 255, 0.12),
      0 32px 64px rgba(0, 0, 0, 0.5);
    animation: fadeUp 0.7s cubic-bezier(.22,.87,.55,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Угловые декоративные линии */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent2);
    border-style: solid;
    opacity: 0.4;
  }
  .card::before { top: 14px; left: 14px; border-width: 1px 0 0 1px; border-radius: 4px 0 0 0; }
  .card::after  { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; border-radius: 0 0 4px 0; }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 28px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
    box-shadow: 0 0 28px var(--glow), 0 0 60px rgba(29,111,255,0.2);
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 28px var(--glow); }
    50%       { box-shadow: 0 0 48px rgba(0,200,255,0.6), 0 0 90px rgba(29,111,255,0.25); }
  }

  .name {
    font-size: clamp(2.6rem, 9vw, 3.4rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #e8f4ff 0%, var(--accent2) 35%, var(--accent1) 65%, #e8f4ff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 5s linear infinite;
    line-height: 1.05;
    margin-bottom: 12px;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .role {
    font-size: 0.8rem;
    color: rgba(0, 200, 255, 0.55);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 36px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 auto 36px;
    width: 80%;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(29,111,255,0.4), transparent);
  }
  .divider-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent2);
    opacity: 0.6;
    box-shadow: 0 0 6px var(--accent2);
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 36px;
  }

  .social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: rgba(29, 111, 255, 0.07);
    border: 1px solid rgba(29, 111, 255, 0.2);
    color: rgba(200, 230, 255, 0.55);
    text-decoration: none;
    transition: all 0.22s ease;
    position: relative;
    overflow: hidden;
  }

  .social-link::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    opacity: 0;
    transition: opacity 0.22s ease;
  }

  .social-link:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 200, 255, 0.5);
    color: #fff;
    box-shadow: 0 8px 24px rgba(0, 200, 255, 0.25);
  }

  .social-link:hover::before { opacity: 1; }
  .social-link svg { position: relative; z-index: 1; width: 22px; height: 22px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-family: 'Golos Text', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 4px 20px rgba(29, 111, 255, 0.4);
  }

  .btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 35%; height: 200%;
    background: rgba(255,255,255,0.18);
    transform: skewX(-20deg);
    transition: left 0.45s ease;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 200, 255, 0.45); }
  .btn:hover::before { left: 130%; }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 18px; height: 18px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    padding: 7px 16px;
    border-radius: 99px;
    background: rgba(29, 111, 255, 0.08);
    border: 1px solid rgba(29, 111, 255, 0.2);
    font-size: 0.75rem;
    color: rgba(180, 220, 255, 0.45);
    letter-spacing: 0.06em;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00e5a0;
    box-shadow: 0 0 6px #00e5a0;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  @media (max-width: 400px) {
    .card { padding: 44px 24px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="card">
  <div class="avatar">Е</div>
  <div class="name">Евгений</div>
  <div class="role">Система вместо хаоса</div>

  <div class="divider"><div class="divider-dot"></div></div>

  <div class="socials">
    <a class="social-link" href="https://t.me/EvgeniySergeevichSh" target="_blank" title="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.19 13.92l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.958.639z"/>
      </svg>
    </a>
  </div>

  <a class="btn" href="https://t.me/EvgeniySergeevichSh" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.19 13.92l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.958.639z"/>
    </svg>
    Написать мне
  </a>

  <div class="status">
    <div class="status-dot"></div>
    Открыт к новым проектам
  </div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dots = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init() {
    dots = [];
    const count = Math.floor((W * H) / 16000);
    for (let i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.4 + 0.08
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(29,111,255,${d.a})`;
      ctx.fill();

      for (let j = i + 1; j < dots.length; j++) {
        const d2 = dots[j];
        const dx = d.x - d2.x, dy = d.y - d2.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d2.x, d2.y);
          ctx.strokeStyle = `rgba(0,200,255,${0.1 * (1 - dist/110)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); init(); });
  resize(); init(); draw();
</script>
</body>
</html>
